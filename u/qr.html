<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code 產生器</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRious Library for Canvas based QR generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }
        /* Color input styling */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            padding: 0;
            overflow: hidden;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
            border: 2px solid #e5e7eb;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left Panel: Controls -->
        <div class="w-full md:w-1/2 p-8 border-b md:border-b-0 md:border-r border-gray-100">
            <div class="flex items-center gap-2 mb-6">
                <i data-lucide="qr-code" class="text-indigo-600 w-8 h-8"></i>
                <h1 class="text-2xl font-bold text-gray-800">QR Code 產生器</h1>
            </div>

            <div class="space-y-6">
                <!-- Text Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">網址或文字內容</label>
                    <textarea 
                        id="text-input" 
                        rows="3"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none resize-none text-gray-800 placeholder-gray-400"
                        placeholder="請在此輸入要轉換的網址或文字..."
                    >https://www.google.com</textarea>
                </div>

                <!-- Settings Grid -->
                <div class="grid grid-cols-2 gap-6">
                    <!-- Size Slider -->
                    <div class="col-span-2">
                        <div class="flex justify-between mb-2">
                            <label class="text-sm font-medium text-gray-700">尺寸 (像素)</label>
                            <span id="size-value" class="text-sm text-indigo-600 font-bold">250px</span>
                        </div>
                        <input 
                            type="range" 
                            id="size-input" 
                            min="100" 
                            max="500" 
                            value="250" 
                            step="10"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                        >
                    </div>

                    <!-- Foreground Color -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">條碼顏色</label>
                        <div class="flex items-center gap-3 p-2 border border-gray-200 rounded-lg hover:bg-gray-50 transition cursor-pointer" onclick="document.getElementById('fg-color').click()">
                            <input type="color" id="fg-color" value="#000000">
                            <span class="text-sm text-gray-500 font-mono" id="fg-color-text">#000000</span>
                        </div>
                    </div>

                    <!-- Background Color -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">背景顏色</label>
                        <div class="flex items-center gap-3 p-2 border border-gray-200 rounded-lg hover:bg-gray-50 transition cursor-pointer" onclick="document.getElementById('bg-color').click()">
                            <input type="color" id="bg-color" value="#ffffff">
                            <span class="text-sm text-gray-500 font-mono" id="bg-color-text">#ffffff</span>
                        </div>
                    </div>
                </div>

                <!-- Level (Optional but good to have hidden logic) -->
                <!-- Hardcoded to High correction level for better scanning -->

            </div>
        </div>

        <!-- Right Panel: Preview & Download -->
        <div class="w-full md:w-1/2 bg-gray-50 p-8 flex flex-col items-center justify-center text-center relative">
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 relative group">
                <!-- Canvas Element for QR Code -->
                <canvas id="qr-canvas" class="max-w-full h-auto"></canvas>
                
                <!-- Decoration dots -->
                <div class="absolute -top-2 -left-2 w-4 h-4 bg-indigo-100 rounded-full"></div>
                <div class="absolute -bottom-2 -right-2 w-4 h-4 bg-indigo-100 rounded-full"></div>
            </div>

            <p class="text-gray-500 text-sm mb-6">
                即時預覽 • 自動修正 • 高解析度
            </p>

            <button 
                onclick="downloadQR()"
                class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-lg font-medium transition-all shadow-lg shadow-indigo-200 transform hover:-translate-y-0.5"
            >
                <i data-lucide="download"></i>
                下載 PNG圖片
            </button>

            <!-- Error Toast (Hidden by default) -->
            <div id="toast" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-4 py-2 rounded-lg text-sm shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none">
                請輸入內容！
            </div>
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // DOM Elements
        const textInput = document.getElementById('text-input');
        const sizeInput = document.getElementById('size-input');
        const sizeValue = document.getElementById('size-value');
        const fgColorInput = document.getElementById('fg-color');
        const bgColorInput = document.getElementById('bg-color');
        const fgColorText = document.getElementById('fg-color-text');
        const bgColorText = document.getElementById('bg-color-text');
        const canvas = document.getElementById('qr-canvas');
        const toast = document.getElementById('toast');

        // Initialize QRious instance
        let qr = new QRious({
            element: canvas,
            size: 250,
            value: 'https://www.google.com',
            foreground: '#000000',
            background: '#ffffff',
            level: 'H' // High error correction
        });

        // Function to update QR Code
        function updateQR() {
            const text = textInput.value;
            const size = parseInt(sizeInput.value);
            const fg = fgColorInput.value;
            const bg = bgColorInput.value;

            // Update UI Labels
            sizeValue.textContent = `${size}px`;
            fgColorText.textContent = fg;
            bgColorText.textContent = bg;

            if (!text.trim()) {
                // If empty, keep canvas but maybe show it blank or keep last valid?
                // Let's just not update the value, effectively pausing it, or clear it.
                // For better UX, we'll generate an empty-like state or stay on previous
                return;
            }

            // Update QR settings
            qr.set({
                size: size,
                value: text,
                foreground: fg,
                background: bg
            });
        }

        // Event Listeners
        textInput.addEventListener('input', updateQR);
        
        sizeInput.addEventListener('input', updateQR);
        
        fgColorInput.addEventListener('input', updateQR);
        fgColorInput.addEventListener('change', updateQR); // Ensure full update on picker close
        
        bgColorInput.addEventListener('input', updateQR);
        bgColorInput.addEventListener('change', updateQR);

        // Download Function
        function downloadQR() {
            if (!textInput.value.trim()) {
                showToast("請先輸入內容！");
                return;
            }

            // Create a temporary link
            const link = document.createElement('a');
            link.download = `qrcode-${Date.now()}.png`;
            // Get data URL from canvas
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Toast Notification Helper
        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        // Initial render
        updateQR();

    </script>
</body>
</html>
